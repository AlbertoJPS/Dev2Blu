<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Exercício</title>
</head>
<body>
    <table>
        <caption><h4>Tabela Produtos</h4></caption>
        <thead>
            <tr bgcolor="#ADD8E6">
                <th align="left">Produto</th>
                <th align="left">Quantidade</th>
                <th align="left">Valor R$</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Smartphone</td>
                <td align="center">2</td>
                <td align="right">1.880,80</td>
            </tr>
            <tr>
                <td>Televisor 40 pol</td>
                <td align="center">3</td>
                <td align="right">5.200,00</td>
            </tr>
            <tr>
                <td>Mesa Escritório</td>
                <td align="center">1</td>
                <td align="right">800,00</td>
            </tr>
            <tr>
                <td>Cadeira Escritório</td>
                <td align="center">1</td>
                <td align="right">400,00</td>
            </tr>
            <tr>
                <td>Computador</td>
                <td align="center">1</td>
                <td align="right">2.800,00</td>
            </tr>
        </tbody>
    </table>
    <p> </p>
    <table>
        <caption><h4>Contas a pagar</h4></caption>
        <thead>
            <tr bgcolor="#ADD8E6">
                <th align="left">Descrição</td>
                <th align="left">Valor</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Água</td>
                <td align="right">44,80</td>
            </tr>
            <tr>
                <td>Lúz</td>
                <td align="right">160,30</td>
            </tr>
            <tr>
                <td>Telefone/tv/internet</td>
                <td align="right">200,00</td>
            </tr>
        </tbody>
        <tfoot>
            <tr bgcolor="#ADD8E6">
                <th align="left">Total</td>
                <th align="left">405,10</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
