<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <table border="1px">
        <caption>Tabela de Carros</caption>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Ano</th>
                <th>Cor</th>
            </tr>
            
        </thead>
        <tbody>
            <tr>
                <td>Celta</td>
                <td>2088</td>
                <td>Preto</td>
            </tr>
            <tr>
                <td>Fusca</td>
                <td>1976</td>
                <td>Azul</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Total de carros</td>
                <td>2</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
