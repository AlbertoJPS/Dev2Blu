<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Formulário</title>
</head>
<body>
    <form method="post" action="http://localhost/Formulários">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="txtNome">Nome: </label>
            <input id="txtNome" type="text" name="nome" placeholder="Digite seu Nome"><br><br>
            <label for="txtEmail">Email: </label>
            <input id="txtEmail" type="email" name="email" placeholder="Digite seu Email"><br><br>
            <label for="numberValor">Valor:  </label>
            <input id="numberValor" type="number" name="valor" step="0.01" min="0" placeholder="Valor de Investimento">
        </fieldset>
        <fieldset>
            <legend>Selecione seus interesses</legend>
            <input type="checkbox" id="esportes" name="interesses" value="esportes">
            <label for="esportes">Esportes</label><br>
            <input type="checkbox" id="leitura" name="interesses" value="leitura">
            <label for="leitura">Leitura</label><br>
            <input type="checkbox" id="musica" name="interesses" value="musica">
            <label for="musica">Música</label>
        </fieldset><br>
        <button type="submit">Enviar</button>
    </form>   
</body>
</html>
