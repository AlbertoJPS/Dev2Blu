<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Formulário</title>
</head>
<body>
    <form method="post" action="http://localhost/Formulários">
        <fieldset>
            <legend>Cadastro de Usuário</legend>
            
            <label for="txtNome">Nome: </label>
            <input id="txtNome" type="text" name="nome" required placeholder="Digite seu Nome"><br><br>
            
            <label for="txtEmail">Email: </label>
            <input id="txtEmail" type="email" name="email" required placeholder="Digite seu Email"><br><br>
            
            <label for="idPassword">Password: </label>
            <input id="idPassword" type="password" name="senha" required placeholder="Digite seu Password"><br><br>
            
            <label for="cbxGenero">Gênero: </label>
            <select id="cbxGenero" name="genero">
                <option value="">Selecione...</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outros">Outros</option>
            </select><br><br>
            
            <label for="dateNascimento">Password: </label>
            <input id="dateNascimento" type="date" name="data" required><br>
        </fieldset>
        <button type="submit">Enviar</button>
    </form>   
</body>
</html>
