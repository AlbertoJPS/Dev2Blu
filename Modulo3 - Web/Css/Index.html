<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }
    div{
        height: 100px;
        width: 100px;
    }
    .vermelho{
        background-color: rgb(207, 52, 52);
    }
    .azul{
        background-color: rgb(75, 161, 219);
    }
    .amarelo{
        background-color: rgb(209, 206, 35);
    }
    .quadrado_pequeno{
        height: 25px;
        width: 25px;
    }
    .quadrado_grande{
        height: 250px;
        width: 250px;
    }
     #quadrado_especial{ /* tem maior prioridade, até mais que o hover */
        background-color: rgb(62, 192, 62);
    }
    div:hover{ 
        background-color: blueviolet;
    }

</style>
<body>
    <div id="quadrado_especial" class="quadrado_grande amarelo"></div>
    <div class="quadrado_pequeno vermelho"></div>
    <div class="azul"></div>
    <div class="quadrado_grande amarelo"></div>
</body>
</html>
