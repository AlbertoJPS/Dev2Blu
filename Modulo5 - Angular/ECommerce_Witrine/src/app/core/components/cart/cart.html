<div class="cart-container bg-white text-gray-800 p-6 rounded-lg shadow-xl m-4">
    
    <h2 class="text-2xl font-bold mb-4 text-orange-600 border-b border-amber-500 pb-2">Meu Carrinho</h2>
    
    @if (books.length === 0) {
        <p class="text-gray-600">O carrinho está vazio. Adicione um livro!</p>
    } @else {
        <ul class="space-y-3">
            
            @for (book of books; track book.id) {
                <li class="flex justify-between items-center bg-gray-100 p-3 rounded-md border-l-4 border-orange-500">
                    
                    <span class="font-medium">{{book.titulo}}</span>
                    
                    <span class="text-sm font-semibold text-gray-800">{{ book.price | currency:'BRL':'symbol':'1.2-2' }}</span>
                </li>
            }
        </ul>
    }
</div>
