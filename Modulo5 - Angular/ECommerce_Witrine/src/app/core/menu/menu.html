<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" xintegrity="sha512-SnH5WK+bZxgPHs44uWIX+LLMDJd/rB1I02jFkL6hU6pT1A79Zz18d/y4jJt3kI78H6w3G5uK4H2O6W5g1B6bQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />


<nav class="w-full p-4 flex justify-between items-center 
            bg-white shadow-lg border-b border-amber-500">
    
    <div class="text-3xl text-gray-800 font-extrabold tracking-wider hover:text-orange-600 transition-colors">
        Witrine
    </div>
    
    <div class="flex gap-1 md:gap-4">
        <a class="text-gray-800 p-2 md:hidden hover:bg-gray-100 rounded-lg transition-colors" routerLink=""></a>

        <a class="hidden md:block text-gray-800 p-2 rounded-lg font-medium hover:bg-gray-100 transition-colors" [routerLink]="['']">Inicio</a>
        
        <a class="hidden md:block text-gray-800 p-2 rounded-lg font-medium hover:bg-gray-100 transition-colors" [routerLink]="['books']">Catálogo</a>
        
        <a class="hidden md:block text-gray-800 p-2 rounded-lg font-medium hover:bg-gray-100 transition-colors" [routerLink]="['aboutus']">Sobre nós</a>      
        
        <a class="hidden md:flex items-center gap-2 bg-orange-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-orange-700 transition-colors" [routerLink]="['cart']">
            
            <i class="fa-solid fa-cart-shopping text-white"></i>
            Carrinho
            
            @if (cartCount > 0) {
                <span class="absolute top-0.5 right-0.5
                           flex items-center justify-center w-5 h-5
