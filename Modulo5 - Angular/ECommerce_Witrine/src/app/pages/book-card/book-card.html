<div
  class="bg-white text-gray-800 p-5 rounded-2xl shadow-lg hover:shadow-xl hover:scale-[1.02] transition-transform duration-300 flex flex-col items-center text-center border border-amber-500"
>
  <img
    [src]="book?.capaUrl"
    [alt]="book?.titulo"
    class="w-full h-48 object-cover rounded-lg mb-4"
  />

  <h1 class="text-2xl font-bold mb-2">{{ book?.titulo }}</h1>

  <p class="text-gray-600 text-sm leading-relaxed mb-4">
    {{ book?.sinopse }}
  </p>

  <button
    (click)="onClick()"
    class="bg-orange-600 hover:bg-orange-700 text-white font-medium py-2 px-5 rounded-md transition-colors duration-200"
  >
    Remover
  </button>
</div>
